<section class="barChartArea">
    <div class="barChartOuterBox">
        <div class="barChartBox">
            <!-- 左邊直的範圍 -->
            <div class="leftBox">
                <div class="chartRangeBox">
                    <!-- 需要幾個間距就新增幾個 -->
                    <span class="number">30%</span>
                    <span class="number">15%</span>
                    <span class="number">0%</span>
                </div>
            </div>
            <!-- 右邊橫的內容 -->
            <div class="rightBox">
                <!-- 背景的裝飾線，需要幾個就複製幾個Line，編輯器使用<i>請自己補空白字元  -->
                <div class="decoLine">
                    <i class="line"> </i>
                    <i class="line"> </i>
                    <i class="line"> </i>
                    <i class="line"> </i>
                    <i class="line"> </i>
                </div>
                <ul class="chartList">
                    <!-- 需要幾個項目就複製幾個li，編輯器使用<i>請自己補空白字元 -->
                    <li>
                        <div class="shapeLine">
                            <div class="currentText">16%</div>
                            <i class="line" style="background-color: #8c4647"> </i>
                        </div>
                        <div class="title">日本</div>
                    </li>
                    <li>
                        <div class="shapeLine">
                            <div class="currentText">10%</div>
                            <i class="line" style="background-color: #b55551"> </i>
                        </div>
                        <div class="title">台灣</div>
                    </li>
                    <li>
                        <div class="shapeLine">
                            <div class="currentText">29%</div>
                            <i class="line" style="background-color: #d0655c"> </i>
                        </div>
                        <div class="title">韓國</div>
                    </li>
                    <li>
                        <div class="shapeLine">
                            <div class="currentText">10.5%</div>
                            <i class="line" style="background-color: #dd8c69"> </i>
                        </div>
                        <div class="title">巴西</div>
                    </li>
                    <li>
                        <div class="shapeLine">
                            <div class="currentText">5%</div>
                            <i class="line" style="background-color: #e6ab77"> </i>
                        </div>
                        <div class="title">阿根廷</div>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</section>
