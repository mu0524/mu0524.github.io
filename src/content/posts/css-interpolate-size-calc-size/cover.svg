<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="收合的面板平滑展開成完整高度，下方是 interpolate-size: allow-keywords">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#d99a2b"/>
    </marker>
    <marker id="tip" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f8a5b"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; fill: #2d2a26; }
    .mono { font-family: "JetBrains Mono", Consolas, monospace; }
    .ink { stroke: #2d2a26; stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
  </style>

  <rect width="1200" height="630" rx="28" fill="#fbf5e9"/>

  <!-- 裝飾 -->
  <circle cx="1090" cy="80" r="44" fill="#f6dfae"/>
  <path d="M120 90 l8 -18 l8 18 l18 8 l-18 8 l-8 18 l-8 -18 l-18 -8 z" fill="#e8b85a"/>
  <path d="M600 70 l5 -12 l5 12 l12 5 l-12 5 l-5 12 l-5 -12 l-12 -5 z" fill="#e8b85a"/>
  <circle cx="90" cy="560" r="6" fill="#e8b85a"/>
  <circle cx="1120" cy="560" r="5" fill="#e8b85a"/>

  <!-- 左：收合 -->
  <g>
    <rect x="130" y="150" width="360" height="72" rx="16" fill="#ffffff" class="ink"/>
    <rect x="160" y="178" width="170" height="16" rx="8" fill="#2d2a26"/>
    <path d="M444 176 l12 12 l12 -12" fill="none" class="ink"/>
    <text x="310" y="270" font-size="24" font-weight="700" text-anchor="middle" fill="#6b645a" class="mono">height: 0</text>
  </g>

  <!-- 過渡 -->
  <path d="M520 190 Q600 130 680 190" fill="none" stroke="#d99a2b" stroke-width="5" stroke-dasharray="4 14" stroke-linecap="round" marker-end="url(#arrow)"/>

  <!-- 右：展開 -->
  <g>
    <rect x="710" y="150" width="360" height="270" rx="16" fill="#ffffff" class="ink"/>
    <path d="M710 222 h360" class="ink"/>
    <rect x="740" y="178" width="170" height="16" rx="8" fill="#2d2a26"/>
    <path d="M1024 194 l12 -12 l12 12" fill="none" class="ink"/>
    <rect x="740" y="252" width="290" height="12" rx="6" fill="#d9d4ca"/>
    <rect x="740" y="280" width="250" height="12" rx="6" fill="#d9d4ca"/>
    <rect x="740" y="308" width="270" height="12" rx="6" fill="#d9d4ca"/>
    <rect x="740" y="344" width="290" height="48" rx="10" fill="#f6dfae"/>
    <line x1="1100" y1="160" x2="1100" y2="410" stroke="#2f8a5b" stroke-width="4" marker-start="url(#tip)" marker-end="url(#tip)"/>
    <text x="1112" y="294" font-size="24" font-weight="700" class="mono" style="fill:#2f8a5b">auto</text>
  </g>

  <!-- 程式碼 -->
  <g>
    <rect x="200" y="470" width="800" height="90" rx="18" fill="#2b2926"/>
    <text x="600" y="527" font-size="32" text-anchor="middle" class="mono" style="fill:#e8e2d6"><tspan style="fill:#9be5b4">interpolate-size</tspan>: <tspan style="fill:#e7b65c">allow-keywords</tspan>;</text>
  </g>
</svg>
