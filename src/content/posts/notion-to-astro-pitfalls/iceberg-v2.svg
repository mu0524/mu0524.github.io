<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 720" width="1120" height="720" role="img" aria-label="冰山圖：水面上是建置就會報錯的問題，剛好在水面下的靠 lint 檢查抓得到，深海的問題要打開頁面才看得出來">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4dc"/>
      <stop offset="1" stop-color="#ffd7ae"/>
    </linearGradient>
    <linearGradient id="shallow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3aa6bf"/>
      <stop offset="1" stop-color="#1f78a2"/>
    </linearGradient>
    <linearGradient id="deep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b5c8c"/>
      <stop offset="1" stop-color="#0a2342"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3fbff"/>
      <stop offset="0.45" stop-color="#a9d6ea"/>
      <stop offset="1" stop-color="#4a88b3"/>
    </linearGradient>
    <clipPath id="card"><rect width="1120" height="720" rx="24"/></clipPath>
  </defs>
  <style>
    text { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; }
    .item { font-size: 20px; font-weight: 500; }
    .onSky { fill: #1b2a41; }
    .onSea { fill: #ffffff; }
    .lead { stroke-width: 2; stroke-dasharray: 2 6; stroke-linecap: round; fill: none; }
    .cap { font-size: 14px; fill: #5b6b7f; }
    .ttl { font-size: 21px; font-weight: 700; fill: #1b2a41; }
    .num { font-size: 17px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
  </style>

  <g clip-path="url(#card)">
    <!-- 天空 -->
    <rect width="1120" height="170" fill="url(#sky)"/>
    <circle cx="930" cy="70" r="34" fill="#ffb86b" opacity="0.9"/>
    <g fill="#ffffff" opacity="0.85">
      <ellipse cx="170" cy="48" rx="46" ry="12"/>
      <ellipse cx="205" cy="40" rx="30" ry="11"/>
      <ellipse cx="690" cy="44" rx="40" ry="10"/>
    </g>

    <!-- 海：淺層與深層 -->
    <rect y="170" width="1120" height="210" fill="url(#shallow)"/>
    <rect y="380" width="1120" height="340" fill="url(#deep)"/>
    <path d="M0 380 H1120" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.35"/>

    <!-- 透進水裡的光 -->
    <g fill="#ffffff" opacity="0.07">
      <path d="M120 170 L190 170 L120 380 L40 380 Z"/>
      <path d="M820 170 L900 170 L1000 380 L910 380 Z"/>
    </g>

    <!-- 水面下的冰山 -->
    <path d="M380 170 L330 250 L302 350 L325 470 L370 570 L460 650 L540 668 L620 610 L680 500 L708 380 L680 260 L630 170 Z" fill="url(#ice)" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round" opacity="0.96"/>
    <g opacity="0.28" fill="#ffffff">
      <path d="M380 170 L330 250 L302 350 L420 300 L470 170 Z"/>
      <path d="M420 300 L302 350 L325 470 L440 440 Z"/>
    </g>
    <g opacity="0.14" fill="#0a2342">
      <path d="M630 170 L680 260 L708 380 L590 330 L560 170 Z"/>
      <path d="M590 330 L708 380 L680 500 L570 470 Z"/>
      <path d="M570 470 L680 500 L620 610 L540 668 L500 560 Z"/>
    </g>
    <path d="M470 170 L420 300 L440 440 L500 560 L540 668 M420 300 L590 330 L570 470 L440 440 M570 470 L500 560" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round" opacity="0.45"/>

    <!-- 水面上的冰山 -->
    <path d="M432 170 L470 105 L498 58 L526 96 L545 88 L580 170 Z" fill="#ffffff" stroke="#1b2a41" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M498 58 L490 120 L510 170 L432 170 L470 105 Z" fill="#dbeef7"/>
    <path d="M432 170 L470 105 L498 58 L526 96 L545 88 L580 170" fill="none" stroke="#1b2a41" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- 水面 -->
    <path d="M0 170 q30 -8 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <path d="M0 182 q30 -6 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.35"/>

    <!-- 泡泡 -->
    <g fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.45">
      <circle cx="250" cy="420" r="5"/>
      <circle cx="262" cy="398" r="3"/>
      <circle cx="232" cy="640" r="6"/>
      <circle cx="246" cy="616" r="3.5"/>
      <circle cx="1040" cy="660" r="5"/>
      <circle cx="1052" cy="638" r="3"/>
    </g>
  </g>

  <!-- 分層標題 -->
  <g>
    <rect x="24" y="78" width="262" height="68" rx="16" fill="#ffffff" opacity="0.94"/>
    <circle cx="58" cy="112" r="17" fill="#e5484d"/>
    <text x="58" y="118" class="num">1</text>
    <text x="86" y="103" class="cap">水面上</text>
    <text x="86" y="130" class="ttl">建置就會報錯</text>

    <rect x="24" y="232" width="262" height="68" rx="16" fill="#ffffff" opacity="0.94"/>
    <circle cx="58" cy="266" r="17" fill="#e8930c"/>
    <text x="58" y="272" class="num">2</text>
    <text x="86" y="257" class="cap">剛好在水面下</text>
    <text x="86" y="284" class="ttl">靠 lint 檢查抓得到</text>

    <rect x="24" y="490" width="262" height="68" rx="16" fill="#ffffff" opacity="0.94"/>
    <circle cx="58" cy="524" r="17" fill="#8e5bd6"/>
    <text x="58" y="530" class="num">3</text>
    <text x="86" y="515" class="cap">深海，建置會過</text>
    <text x="86" y="542" class="ttl">打開頁面才看得出來</text>
  </g>

  <!-- 第一層項目 -->
  <path d="M520 120 H758" class="lead" stroke="#1b2a41"/>
  <circle cx="520" cy="120" r="8" fill="#e5484d" stroke="#ffffff" stroke-width="2.5"/>
  <text x="770" y="127" class="item onSky">缺 frontmatter → 建置失敗</text>

  <!-- 第二層項目 -->
  <g>
    <path d="M610 222 H758 M640 282 H758 M660 342 H758" class="lead" stroke="#ffffff"/>
    <circle cx="610" cy="222" r="8" fill="#f5a524" stroke="#ffffff" stroke-width="2.5"/>
    <text x="770" y="229" class="item onSea">程式碼網址被包 &lt; &gt;</text>
    <circle cx="640" cy="282" r="8" fill="#f5a524" stroke="#ffffff" stroke-width="2.5"/>
    <text x="770" y="289" class="item onSea">佔位字串、Notion 連結沒換掉</text>
    <circle cx="660" cy="342" r="8" fill="#f5a524" stroke="#ffffff" stroke-width="2.5"/>
    <text x="770" y="349" class="item onSea">圖片沒有 alt</text>
  </g>

  <!-- 第三層項目 -->
  <g>
    <path d="M650 432 H758 M640 492 H758 M610 552 H758 M570 612 H758" class="lead" stroke="#ffffff"/>
    <circle cx="650" cy="432" r="8" fill="#a678e8" stroke="#ffffff" stroke-width="2.5"/>
    <text x="770" y="439" class="item onSea">粗體的星號露出來</text>
    <circle cx="640" cy="492" r="8" fill="#a678e8" stroke="#ffffff" stroke-width="2.5"/>
    <text x="770" y="499" class="item onSea">連結 404</text>
    <circle cx="610" cy="552" r="8" fill="#a678e8" stroke="#ffffff" stroke-width="2.5"/>
    <text x="770" y="559" class="item onSea">圖片外連</text>
    <circle cx="570" cy="612" r="8" fill="#a678e8" stroke="#ffffff" stroke-width="2.5"/>
    <text x="770" y="619" class="item onSea">標題層級被壓平</text>
  </g>
</svg>
