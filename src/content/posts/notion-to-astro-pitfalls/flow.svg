    .num { fill: #e7b65c; stroke: #2d2a26; stroke-width: 3; }
    .title { font-size: 21px; font-weight: 700; }
    .sub { font-size: 16px; fill: #6b645a; }
    .arrow { stroke: #d99a2b; stroke-width: 4; stroke-linecap: round; marker-end: url(#arrow); }
  </style>

  <rect width="960" height="250" rx="24" fill="#fbf5e9"/>

  <g>
    <rect x="30" y="70" width="150" height="130" rx="16" class="box"/>
    <circle cx="105" cy="70" r="22" class="num"/>
    <text x="105" y="78" font-size="22" font-weight="700">1</text>
    <text x="105" y="135" class="title">解壓縮</text>
    <text x="105" y="166" class="sub">用 Python</text>
  </g>
  <line x1="186" y1="135" x2="210" y2="135" class="arrow"/>

  <g>
    <rect x="220" y="70" width="150" height="130" rx="16" class="box"/>
    <circle cx="295" cy="70" r="22" class="num"/>
    <text x="295" y="78" font-size="22" font-weight="700">2</text>
    <text x="295" y="135" class="title">改檔名</text>
    <text x="295" y="166" class="sub">英文 slug</text>
  </g>
  <line x1="376" y1="135" x2="400" y2="135" class="arrow"/>

  <g>
    <rect x="410" y="70" width="150" height="130" rx="16" class="box"/>
    <circle cx="485" cy="70" r="22" class="num"/>
    <text x="485" y="78" font-size="22" font-weight="700">3</text>
    <text x="485" y="135" class="title">frontmatter</text>
    <text x="485" y="166" class="sub">補欄位、刪 H1</text>
  </g>
  <line x1="566" y1="135" x2="590" y2="135" class="arrow"/>

  <g>
    <rect x="600" y="70" width="150" height="130" rx="16" class="box"/>
    <circle cx="675" cy="70" r="22" class="num"/>
    <text x="675" y="78" font-size="22" font-weight="700">4</text>
    <text x="675" y="135" class="title">檢查內文</text>
    <text x="675" y="166" class="sub">跑 grep 指令</text>
