  <line x1="756" y1="135" x2="780" y2="135" class="arrow"/>

  <g>
    <rect x="790" y="70" width="150" height="130" rx="16" class="box" style="fill:#fff6e0"/>
    <circle cx="865" cy="70" r="22" class="num"/>
    <text x="865" y="78" font-size="22" font-weight="700">5</text>
